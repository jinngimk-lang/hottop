name: production-smoke

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/production-smoke.yml"
      - "config/video/**"
      - "examples/video/**"
      - "src/hottop/video_*.py"
      - "tests/test_production_smoke_workflow.py"
      - "pyproject.toml"
  pull_request:
    paths:
      - ".github/workflows/production-smoke.yml"
      - "config/video/**"
      - "examples/video/**"
      - "src/hottop/video_*.py"
      - "tests/test_production_smoke_workflow.py"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  software3d-production-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HOTTOP_CAPTION_FONT: /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install free local media dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng-espeak fonts-noto-cjk
          espeak --version | grep -F "eSpeak NG"
          python -m pip install --upgrade pip
          pip install -e ".[dev,video]"
          test -f "$HOTTOP_CAPTION_FONT"
          python - <<'PY'
          import os
          from PIL import ImageFont

          font = ImageFont.truetype(os.environ["HOTTOP_CAPTION_FONT"], 48)
          assert bytes(font.getmask("妈")) != bytes(font.getmask("傻"))
          PY
      - name: Probe current role-aware eSpeak-NG Mandarin dialogue budget
        run: |
          python - <<'PY'
          import subprocess
          import tempfile
          import wave
          from pathlib import Path

          from hottop.video_espeak_style import resolve_espeak_dialogue_style

          probes = [
              (155, "young-cow", "frustrated, startled conversational Mandarin; comedic but clearly intelligible", "哎呀，又绊我！"),
              (155, "young-cow", "brief panicked call for help in natural Mandarin; loud enough to land the comedy beat without shouting distortion", "妈——！"),
              (155, "mother-cow", "calm deadpan maternal Mandarin; matter-of-fact and slightly unimpressed", "用 InkClawAgent。"),
              (155, "young-cow", "surprised, skeptical conversational Mandarin with a short upward reaction", "啊？这么直接？"),
              (155, "mother-cow", "dry compact deadpan Mandarin; quiet closing authority", "别被蛇绊住。"),
              (145, "witch", "tense, hopeful", "就差一点。"),
              (145, "witch", "matter-of-fact", "先配环境。"),
              (145, "witch", "frustrated", "怎么越写越大？"),
              (145, "witch", "relieved", "直接干活。"),
              (145, "witch", "deadpan realization", "早说啊！"),
          ]
          role_pitches = {}
          with tempfile.TemporaryDirectory() as directory:
              for index, (base_rate, character, delivery, text) in enumerate(probes, start=1):
                  style = resolve_espeak_dialogue_style(
                      character=character,
                      delivery=delivery,
                      base_rate_wpm=base_rate,
                  )
                  role_pitches.setdefault(character, style.pitch)
                  assert role_pitches[character] == style.pitch, character
                  path = Path(directory) / f"probe-{index:02d}.wav"
                  subprocess.run(
                      [
                          "espeak",
                          "-v",
                          "zh",
                          "-p",
                          str(style.pitch),
                          "-s",
                          str(style.rate_wpm),
                          "-w",
                          str(path),
                          text,
                      ],
                      check=True,
                  )
                  with wave.open(str(path), "rb") as wav:
                      duration = wav.getnframes() / wav.getframerate()
                  print(
                      "HOTTOP_ESPEAK_NG_PROBE "
                      f"character={character} pitch={style.pitch} rate={style.rate_wpm} "
                      f"duration={duration:.3f}s text={text}"
                  )
                  assert duration <= 3.25, (text, duration)

          assert abs(role_pitches["young-cow"] - role_pitches["mother-cow"]) >= 6
          print(
              "HOTTOP_ESPEAK_NG_ROLE_SEPARATION "
              f"young-cow={role_pitches['young-cow']} "
              f"mother-cow={role_pitches['mother-cow']}"
          )
          PY
      - name: Execute checked-in anti-polish cow story
        run: |
          hottop video-run examples/video/inkclaw-cow-snake.render.json \
            --config config/video/anti-polish-software3d.yml \
            --output-dir artifacts/production-smoke/cow \
            --project-root . \
            --execute \
            --output artifacts/production-smoke/cow/run-result.json
      - name: Execute checked-in cinematic Odyssey story
        run: |
          hottop video-run examples/video/inkclaw-odyssey-witch-pigs.render.json \
            --config config/video/cinematic-software3d.yml \
            --output-dir artifacts/production-smoke/odyssey \
            --project-root . \
            --execute \
            --output artifacts/production-smoke/odyssey/run-result.json
      - name: Verify both final media and provenance chains
        run: |
          for case in cow odyssey; do
            test -s "artifacts/production-smoke/${case}/hottop-output.mp4"
            test "$(find "artifacts/production-smoke/${case}/shots" -name '*.artifact.json' -type f | wc -l)" -eq 5
            ffprobe -v error \
              -show_entries stream=codec_type,codec_name,pix_fmt \
              -show_entries format=duration \
              -of json \
              "artifacts/production-smoke/${case}/hottop-output.mp4" \
              > "artifacts/production-smoke/${case}/ffprobe.json"
          done
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("artifacts/production-smoke")
          for case in ("cow", "odyssey"):
              case_root = root / case
              probe = json.loads((case_root / "ffprobe.json").read_text())
              streams = probe["streams"]
              video = next(item for item in streams if item["codec_type"] == "video")
              audio = next(item for item in streams if item["codec_type"] == "audio")
              assert video["codec_name"] == "h264"
              assert video["pix_fmt"] == "yuv420p"
              assert audio["codec_name"] == "aac"
              assert float(probe["format"]["duration"]) > 0

              result = json.loads((case_root / "run-result.json").read_text())
              assert result["executed"] is True
              assert len(result["artifact_manifest_paths"]) == 5
              for manifest in result["artifact_manifest_paths"]:
                  assert Path(manifest).is_file()
              assert all(
                  "Full dictionary is not installed for 'zh'" not in summary
                  for summary in result["command_summaries"]
              )

              output = case_root / "hottop-output.mp4"
              (case_root / "sha256.txt").write_text(
                  hashlib.sha256(output.read_bytes()).hexdigest() + "  hottop-output.mp4\n",
                  encoding="utf-8",
              )
          PY
      - name: Upload reproducible production evidence
        uses: actions/upload-artifact@v4
        with:
          name: hottop-software3d-production-smoke
          if-no-files-found: error
          retention-days: 7
          path: |
            artifacts/production-smoke/cow/hottop-output.mp4
            artifacts/production-smoke/cow/run-result.json
            artifacts/production-smoke/cow/hottop-video-plan.json
            artifacts/production-smoke/cow/ffprobe.json
            artifacts/production-smoke/cow/sha256.txt
            artifacts/production-smoke/cow/shots/*.artifact.json
            artifacts/production-smoke/odyssey/hottop-output.mp4
            artifacts/production-smoke/odyssey/run-result.json
            artifacts/production-smoke/odyssey/hottop-video-plan.json
            artifacts/production-smoke/odyssey/ffprobe.json
            artifacts/production-smoke/odyssey/sha256.txt
            artifacts/production-smoke/odyssey/shots/*.artifact.json