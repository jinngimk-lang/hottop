name: cinematic-delivery-smoke

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cinematic-delivery-smoke.yml"
      - "config/video/cinematic-software3d-delivery.yml"
      - "examples/video/inkclaw-odyssey-witch-pigs.render.json"
      - "src/hottop/video_*.py"
      - "tests/test_cinematic_delivery_smoke_workflow.py"
      - "pyproject.toml"
  pull_request:
    paths:
      - ".github/workflows/cinematic-delivery-smoke.yml"
      - "config/video/cinematic-software3d-delivery.yml"
      - "examples/video/inkclaw-odyssey-witch-pigs.render.json"
      - "src/hottop/video_*.py"
      - "tests/test_cinematic_delivery_smoke_workflow.py"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cinematic-software3d-delivery:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      HOTTOP_CAPTION_FONT: /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install free local media dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng-espeak fonts-noto-cjk
          espeak --version | grep -F "eSpeak NG"
          python -m pip install --upgrade pip
          pip install -e ".[dev,video]" threadpoolctl
          test -f "$HOTTOP_CAPTION_FONT"
      - name: Execute 720p24 cinematic Odyssey delivery
        run: |
          hottop video-run examples/video/inkclaw-odyssey-witch-pigs.render.json \
            --config config/video/cinematic-software3d-delivery.yml \
            --output-dir artifacts/cinematic-delivery/odyssey \
            --project-root . \
            --execute \
            --output artifacts/cinematic-delivery/odyssey/run-result.json
      - name: Capture media runtime provenance
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import platform
          import shutil
          import subprocess
          from contextlib import redirect_stdout
          from importlib.metadata import version
          from io import StringIO
          from pathlib import Path

          import numpy as np
          from threadpoolctl import threadpool_info

          root = Path("artifacts/cinematic-delivery/odyssey")
          root.mkdir(parents=True, exist_ok=True)
          font_path = Path(os.environ["HOTTOP_CAPTION_FONT"])

          def executable_info(name: str, *version_args: str) -> dict[str, object]:
              resolved = shutil.which(name)
              if resolved is None:
                  raise RuntimeError(f"required executable not found: {name}")
              path = Path(resolved).resolve()
              completed = subprocess.run(
                  [str(path), *version_args],
                  capture_output=True,
                  text=True,
                  check=True,
              )
              combined = completed.stdout.strip() or completed.stderr.strip()
              return {
                  "resolved_path": str(path),
                  "version": combined.splitlines()[0],
                  "size_bytes": path.stat().st_size,
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
              }

          def cpu_info() -> dict[str, str]:
              cpuinfo_path = Path("/proc/cpuinfo")
              cpuinfo_bytes = cpuinfo_path.read_bytes()
              first_processor: dict[str, str] = {}
              for line in cpuinfo_bytes.decode("utf-8", errors="replace").splitlines():
                  if not line.strip():
                      break
                  if ":" not in line:
                      continue
                  key, value = line.split(":", 1)
                  first_processor[key.strip()] = value.strip()
              return {
                  "machine": platform.machine(),
                  "model_name": first_processor.get("model name", "unknown"),
                  "vendor_id": first_processor.get("vendor_id", "unknown"),
                  "cpuinfo_sha256": hashlib.sha256(cpuinfo_bytes).hexdigest(),
              }

          def capture_numpy_report(reporter) -> str:
              stream = StringIO()
              with redirect_stdout(stream):
                  reporter()
              return stream.getvalue().strip()

          def native_numeric_libraries() -> list[dict[str, object]]:
              libraries: list[dict[str, object]] = []
              seen_paths: set[str] = set()
              for item in threadpool_info():
                  if not item.get("filepath"):
                      continue
                  path = Path(item["filepath"]).resolve()
                  if not path.is_file():
                      raise RuntimeError(f"loaded numeric library is not a file: {path}")
                  resolved = str(path)
                  if resolved in seen_paths:
                      continue
                  seen_paths.add(resolved)
                  libraries.append(
                      {
                          "resolved_path": resolved,
                          "internal_api": item.get("internal_api"),
                          "user_api": item.get("user_api"),
                          "version": item.get("version"),
                          "size_bytes": path.stat().st_size,
                          "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                      }
                  )
              if not libraries:
                  raise RuntimeError("no loaded native numeric libraries detected")
              return sorted(libraries, key=lambda item: str(item["resolved_path"]))

          def numeric_runtime_info() -> dict[str, object]:
              thread_variables = (
                  "OMP_NUM_THREADS",
                  "OPENBLAS_NUM_THREADS",
                  "MKL_NUM_THREADS",
                  "NUMEXPR_NUM_THREADS",
                  "BLIS_NUM_THREADS",
                  "VECLIB_MAXIMUM_THREADS",
              )
              numpy_config = capture_numpy_report(lambda: np.show_config())
              numpy_runtime = capture_numpy_report(lambda: np.show_runtime())
              return {
                  "logical_cpu_count": os.cpu_count(),
                  "thread_env": {name: os.environ.get(name) for name in thread_variables},
                  "numpy_config": numpy_config,
                  "numpy_config_sha256": hashlib.sha256(numpy_config.encode("utf-8")).hexdigest(),
                  "numpy_runtime": numpy_runtime,
                  "numpy_runtime_sha256": hashlib.sha256(numpy_runtime.encode("utf-8")).hexdigest(),
                  "native_libraries": native_numeric_libraries(),
              }

          provenance = {
              "schema_version": "hottop.runtime-provenance.v1",
              "python": platform.python_version(),
              "platform": platform.platform(),
              "cpu": cpu_info(),
              "numerics": numeric_runtime_info(),
              "packages": {
                  "hottop": version("hottop"),
                  "moviepy": version("moviepy"),
                  "numpy": version("numpy"),
                  "pillow": version("pillow"),
                  "threadpoolctl": version("threadpoolctl"),
              },
              "executables": {
                  "ffmpeg": executable_info("ffmpeg", "-version"),
                  "ffprobe": executable_info("ffprobe", "-version"),
                  "espeak": executable_info("espeak", "--version"),
              },
              "caption_font": {
                  "path": str(font_path),
                  "size_bytes": font_path.stat().st_size,
                  "sha256": hashlib.sha256(font_path.read_bytes()).hexdigest(),
              },
          }
          (root / "runtime-provenance.json").write_text(
              json.dumps(provenance, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Verify delivery media and provenance
        run: |
          test -s artifacts/cinematic-delivery/odyssey/hottop-output.mp4
          test -s artifacts/cinematic-delivery/odyssey/runtime-provenance.json
          test "$(find artifacts/cinematic-delivery/odyssey/shots -name '*.artifact.json' -type f | wc -l)" -eq 5
          ffprobe -v error \
            -show_entries stream=codec_type,codec_name,pix_fmt,width,height,avg_frame_rate \
            -show_entries format=duration \
            -of json \
            artifacts/cinematic-delivery/odyssey/hottop-output.mp4 \
            > artifacts/cinematic-delivery/odyssey/ffprobe.json
          python - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          import numpy as np

          root = Path("artifacts/cinematic-delivery/odyssey")
          probe = json.loads((root / "ffprobe.json").read_text())
          video = next(item for item in probe["streams"] if item["codec_type"] == "video")
          audio = next(item for item in probe["streams"] if item["codec_type"] == "audio")

          assert video["codec_name"] == "h264"
          assert video["pix_fmt"] == "yuv420p"
          assert video["width"] == 720
          assert video["height"] == 1280
          assert video["avg_frame_rate"] == "24/1"
          assert audio["codec_name"] == "aac"
          assert float(probe["format"]["duration"]) > 0

          result = json.loads((root / "run-result.json").read_text())
          assert result["executed"] is True
          assert len(result["artifact_manifest_paths"]) == 5
          for manifest in result["artifact_manifest_paths"]:
              assert Path(manifest).is_file()

          runtime = json.loads((root / "runtime-provenance.json").read_text())
          assert runtime["schema_version"] == "hottop.runtime-provenance.v1"
          assert runtime["packages"]["hottop"]
          assert runtime["packages"]["moviepy"]
          assert runtime["packages"]["numpy"]
          assert runtime["packages"]["pillow"]
          assert runtime["packages"]["threadpoolctl"]
          assert runtime["cpu"]["machine"]
          assert runtime["cpu"]["model_name"]
          assert runtime["cpu"]["vendor_id"]
          assert len(runtime["cpu"]["cpuinfo_sha256"]) == 64
          assert runtime["numerics"]["logical_cpu_count"] > 0
          assert runtime["numerics"]["numpy_config"]
          assert len(runtime["numerics"]["numpy_config_sha256"]) == 64
          assert runtime["numerics"]["numpy_runtime"]
          assert len(runtime["numerics"]["numpy_runtime_sha256"]) == 64
          assert isinstance(runtime["numerics"]["thread_env"], dict)
          assert runtime["numerics"]["native_libraries"]
          for identity in runtime["numerics"]["native_libraries"]:
              path = Path(identity["resolved_path"])
              assert path.is_file()
              assert identity["size_bytes"] > 0
              assert identity["size_bytes"] == path.stat().st_size
              assert len(identity["sha256"]) == 64
              assert identity["sha256"] == hashlib.sha256(path.read_bytes()).hexdigest()
          assert runtime["executables"]["ffmpeg"]["version"]
          assert runtime["executables"]["ffprobe"]["version"]
          assert "eSpeak NG" in runtime["executables"]["espeak"]["version"]
          for executable in ("ffmpeg", "ffprobe", "espeak"):
              identity = runtime["executables"][executable]
              assert Path(identity["resolved_path"]).is_file()
              assert identity["size_bytes"] > 0
              assert len(identity["sha256"]) == 64
          assert runtime["executables"]["ffmpeg"]["sha256"]
          assert runtime["executables"]["ffprobe"]["sha256"]
          assert runtime["executables"]["espeak"]["sha256"]
          assert len(runtime["caption_font"]["sha256"]) == 64
          assert runtime["caption_font"]["size_bytes"] > 0

          output = root / "hottop-output.mp4"
          (root / "sha256.txt").write_text(
              hashlib.sha256(output.read_bytes()).hexdigest() + "  hottop-output.mp4\n",
              encoding="utf-8",
          )

          plan = json.loads((root / "hottop-video-plan.json").read_text())
          fps = float(plan["fps"])
          raw = subprocess.run(
              [
                  "ffmpeg",
                  "-v",
                  "error",
                  "-i",
                  str(output),
                  "-vf",
                  "scale=90:160,format=gray",
                  "-f",
                  "rawvideo",
                  "-pix_fmt",
                  "gray",
                  "-",
              ],
              check=True,
              capture_output=True,
          ).stdout
          frame_size = 90 * 160
          assert len(raw) >= frame_size * 2
          assert len(raw) % frame_size == 0
          frames = np.frombuffer(raw, dtype=np.uint8).reshape(-1, 160, 90)
          deltas = np.mean(
              np.abs(np.diff(frames.astype(np.int16), axis=0)),
              axis=(1, 2),
          )
          seam_indices = [
              max(0, min(len(deltas) - 1, round(float(shot["start_seconds"]) * fps) - 1))
              for shot in plan["shots"][1:]
          ]
          excluded = set()
          for seam_index in seam_indices:
              excluded.update(range(max(0, seam_index - 2), min(len(deltas), seam_index + 3)))
          intra = np.asarray(
              [delta for index, delta in enumerate(deltas) if index not in excluded],
              dtype=float,
          )
          assert intra.size > 0
          intra_p95 = float(np.percentile(intra, 95))
          seam_deltas = [float(deltas[index]) for index in seam_indices]
          max_seam_delta = max(seam_deltas)
          max_seam_ratio = max_seam_delta / max(intra_p95, 1e-6)
          seam_evidence = {
              "schema_version": "hottop.software3d-seam-quality.v1",
              "case": "odyssey-720p24",
              "fps": fps,
              "sample_width": 90,
              "sample_height": 160,
              "intra_p95": round(intra_p95, 6),
              "seam_deltas": [round(value, 6) for value in seam_deltas],
              "max_seam_delta": round(max_seam_delta, 6),
              "max_seam_ratio": round(max_seam_ratio, 6),
          }
          (root / "seam-quality.json").write_text(
              json.dumps(seam_evidence, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(
              "HOTTOP_SEAM_QUALITY "
              f"case=odyssey-720p24 seams={','.join(f'{value:.3f}' for value in seam_deltas)} "
              f"intra_p95={intra_p95:.3f} max_delta={max_seam_delta:.3f} "
              f"max_ratio={max_seam_ratio:.3f}"
          )
          assert max_seam_delta <= 8.0, seam_evidence
          assert max_seam_ratio <= 5.5, seam_evidence
          PY
      - name: Upload cinematic delivery evidence
        uses: actions/upload-artifact@v4
        with:
          name: hottop-cinematic-software3d-delivery
          if-no-files-found: error
          retention-days: 7
          path: |
            artifacts/cinematic-delivery/odyssey/hottop-output.mp4
            artifacts/cinematic-delivery/odyssey/run-result.json
            artifacts/cinematic-delivery/odyssey/hottop-video-plan.json
            artifacts/cinematic-delivery/odyssey/ffprobe.json
            artifacts/cinematic-delivery/odyssey/runtime-provenance.json
            artifacts/cinematic-delivery/odyssey/sha256.txt
            artifacts/cinematic-delivery/odyssey/seam-quality.json
            artifacts/cinematic-delivery/odyssey/shots/*.artifact.json
