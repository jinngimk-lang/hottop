schema_version: hottop.video-config.v1
name: odyssey-software3d
style_profile: anti-polish
roughness_score: 62
generation_backend: software3d
compositor_backend: moviepy
encoder_backend: ffmpeg
width: 360
height: 640
fps: 12
duration_seconds: 12.0
output_format: mp4
shot_policy:
  min_shot_seconds: 1.0
  max_shot_seconds: 2.0
  transition_bias:
    - follow
    - eyeline
    - match-action
    - foreground-occlusion
audio:
  bgm_style: original cheap mythic comedy, dry plucked strings, crude hand percussion, restrained heroic pulses
  dialogue_duck_db: -8
  foley_style: blunt banquet Foley, cheap magical poof, hoof taps, laptop clacks, deliberately modest but intelligible
  voice_backend: espeak
  voice_profile: mythic-deadpan-mandarin
  voice_language: zh
  voice_rate_wpm: 150
  music_backend: synthetic
  music_profile: original-cheap-mythic-comedy
  sfx_backend: procedural
  sfx_profile: mythic-banquet-transformation-foley
  original_music_only: true
text:
  subtitle_mode: dialogue-first
  max_end_card_seconds: 0.5
  allow_url: false
  allow_qr: false
anti_polish:
  enabled: true
  rough_3d: true
  low_poly_bias: true
  awkward_motion: true
  deadpan_acting: true
  cheap_instrumentation: true
  forbid_glossy_ai_ad_defaults: true
  precision_must_remain:
    - character continuity
    - scene geography
    - transformation cause and effect
    - subtitle correctness
    - dialogue intelligibility
    - comedy timing
    - product semantics
    - rights safety
moviepy:
  shot_dir: shots
  composite_name: odyssey-software3d-composite.mp4
ffmpeg:
  video_codec: libx264
  audio_codec: aac
  pixel_format: yuv420p
  movflags: +faststart
