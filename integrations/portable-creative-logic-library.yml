learned_cases:
  - id: 2026-09-01-user-platform-performance
    source_kind: user_provided_platform_screenshots
    scope: account_specific_observation
    generalizable_lessons:
      - 具体冲突或具体结果通常应先于品牌自我介绍。
      - 陌生品牌名本身不是强冷启动钩子，除非已有明确需求。
      - 图文滑动深度低时，核心信息或笑点优先放第一张。
      - 事件/数字能拿注意力，但互动仍需要评论、收藏或转发理由。
    do_not_overgeneralize: true
  - id: 2026-09-01-unitree-question-to-work
    source_kind: current_hotspot_plus_user_preference
    hotspot_native_hook: 大家都想知道宇树值多少钱
    portable_pattern: hotspot_question_product_work
    generalization: 使用当前用户真实在问的问题做标题，再让当前产品承担回答或行动所需的真实工作。
    product_independent: true
    example_role_map:
      research_product: 找证据、比较假设、输出研究备忘录
      automation_product: 执行问题提出后需要跑的工作流
      knowledge_product: 整理来源与决策上下文
      creative_product: 把问题转成视觉/故事/内容产物
      sales_product: 找到热点背后的真实买家、卖家、采购或需求信号
    guardrails: [不伪造估值或投资结论, 宣传画默认不复制真实机器人精确外观]
