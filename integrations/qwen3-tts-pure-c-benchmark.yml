runtime_boundary: >-
  Research/benchmark candidate only. Operator must provision an exact local source checkout,
  build and model directory manually. Hottop must not invoke upstream download helpers,
  build dependencies, voice-download helpers, GPU provisioning or hosted services.
benchmark_protocol: >-
  Compare against qwentts.cpp, CrispASR and audio.cpp using the same Mandarin line,
  the same checkpoint-supported preset speaker and semantically comparable generation controls.
  Bind exact runtime revision, exact model bytes/revision, hardware/execution profile,
  output WAV bytes, PCM integrity, duration, repeated speaker consistency, short-onset stability,
  intelligibility, naturalness and latency/RTF. Runtime support is not Mandarin quality proof.
