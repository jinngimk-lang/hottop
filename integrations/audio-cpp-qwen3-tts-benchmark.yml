runtime_boundary: >-
  Exact reviewed source a76ec04f620da829e4a53032247369083ba1ad45 exposes Qwen3-TTS
  1.7B CustomVoice through a native ggml runtime. The reviewed documentation separates
  Base reference-audio cloning, VoiceDesign instruction conditioning and CustomVoice
  packaged-speaker conditioning; CustomVoice uses --speaker and optional --instruct.
  Hottop must not download Qwen assets, build audio.cpp, convert checkpoints or provision
  hardware automatically. Only operator-provisioned source/build or a manually provisioned,
  exact-digest-reviewed upstream prebuilt plus independently reviewed local model/tokenizer
  bytes may enter a separate benchmark run. The v0.7.0 prebuilt provenance above proves only
  the runtime archive identity; Hottop must still verify the extracted executable locally and
  must not infer Qwen capability, runtime success or audio quality from release publication.
