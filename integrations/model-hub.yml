    runtime_boundary: Exact source e351224366be169076e94af1454115d91d458313 only for the reviewed baseline. Operator-provisioned local Stand-In and Wan2.2 weights only; Hottop must never invoke the upstream automatic download path. Physical DGX feasibility remains unprobed and identity claims require complete output-side evaluator evidence.
